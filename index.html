<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Cacciatore di Stelle Cadenti</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--red:#ff4b4b;--dim:#ff7777;--bg:#030000;--panel:#110303}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--red);font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100%;overflow:hidden}
body{touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 5px}
h1{font-size:18px;margin:0;font-weight:700}.sub{font-size:11px;opacity:.75}
button{background:#180505;color:var(--red);border:1px solid #702020;border-radius:10px;padding:8px 10px;font-weight:700}
main{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.compassWrap{position:relative;flex:1;min-height:250px;display:grid;place-items:center;overflow:hidden;border:1px solid #3d0c0c;border-radius:18px;background:radial-gradient(circle,#160303 0,#060000 62%,#000 100%)}
.compass{width:min(82vw,390px);height:min(82vw,390px);max-height:55vh;border:2px solid #8d2828;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:0 0 30px #240000 inset}
.compass:before{content:"";position:absolute;inset:8%;border:1px solid #451313;border-radius:50%}

/* MODIFICA 1: Il quadrante (tick) ora ruota */
.tick-container {
    position: absolute;
    inset: 0;
    transition: transform 0.12s linear;
    pointer-events: none;
}
.tick{position:absolute;inset:0;text-align:center;font-weight:800;font-size:15px}
.n{position:absolute;top:8px;left:50%;transform:translateX(-50%)}
.e{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
.s{position:absolute;bottom:8px;left:50%;transform:translateX(-50%)}
.w{position:absolute;left:12px;top:50%;transform:translateY(-50%)}

/* MODIFICA 2: La freccia è fissa e punta sempre verso l'alto */
.arrow-fixed {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-bottom: 90px solid var(--red);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -100%);
    filter: drop-shadow(0 0 7px #f00);
    z-index: 10;
    pointer-events: none;
}
.center{text-align:center;font-size:28px;font-weight:900;position:relative;z-index:2;background:rgba(0,0,0,0.5);padding:4px 12px;border-radius:8px}
.bearing{font-size:13px;margin-top:4px}.target{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;font-size:12px;background:#0d0202dd;padding:7px;border-radius:9px;z-index:5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:var(--panel);border:1px solid #3d0c0c;border-radius:12px;padding:10px}.label{font-size:10px;opacity:.7;text-transform:uppercase}.value{font-size:16px;font-weight:800;margin-top:3px}.small{font-size:11px;line-height:1.35}
.status{font-size:11px;min-height:16px;text-align:center}.controls{display:flex;gap:7px}.controls button{flex:1}
.redfilter{position:fixed;inset:0;background:rgba(255,0,0,.10);pointer-events:none;mix-blend-mode:multiply}
@media(min-width:700px){.app{max-width:800px;margin:auto}.compassWrap{min-height:430px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>🌠 Cacciatore di Stelle Cadenti</h1><div class="sub">Punta il telefono verso il cielo</div></div><button id="nightBtn">🔴 NOTTE</button></header>
<main>
<div class="compassWrap">
  <div class="compass" id="compass">
    <!-- Il quadrante ruota -->
    <div class="tick-container" id="tickContainer">
        <div class="tick">
            <span class="n">N</span>
            <span class="e">E</span>
            <span class="s">S</span>
            <span class="w">O</span>
        </div>
    </div>
    <!-- La freccia rimane fissa verso l'alto -->
    <div class="arrow-fixed"></div>
    <div><div class="center" id="heading">--°</div><div class="bearing" id="dir">Attendo bussola…</div></div>
    <div class="target" id="target">Calcolo della direzione meteorica…</div>
  </div>
</div>
<div class="status" id="status">Premi "Avvia sensori" e consenti GPS/orientamento.</div>
<div class="controls"><button id="start">📍 Avvia sensori</button><button id="cal">🧭 Calibra</button></div>
<div class="grid">
  <div class="card"><div class="label">Posizione</div><div class="value" id="gps">--</div><div class="small" id="place">GPS non attivo</div></div>
  <div class="card"><div class="label">Luna</div><div class="value" id="moon">--</div><div class="small" id="moonInfo">--</div></div>
  <div class="card"><div class="label">Sciame attivo</div><div class="value" id="shower">--</div><div class="small" id="showerInfo">--</div></div>
  <div class="card"><div class="label">Direzione consigliata</div><div class="value" id="best">--</div><div class="small" id="bestInfo">--</div></div>
</div>
</main>
</div>
<div class="redfilter" id="redfilter" style="display:none"></div>
<script>
const $=id=>document.getElementById(id);
let heading=0, lat=null, lon=null, watch=null, night=false;
const showers=[
 {name:"Quadrantidi",peak:[1,4],active:[12,28,1,12],rate:25,az:45},
 {name:"Liridi",peak:[4,22],active:[4,16,4,30],rate:18,az:70},
 {name:"Eta Aquaridi",peak:[5,6],active:[4,19,5,28],rate:50,az:110},
 {name:"Delta Aquaridi",peak:[7,30],active:[7,12,8,23],rate:25,az:140},
 {name:"Perseidi",peak:[8,12],active:[7,17,8,24],rate:100,az:45},
 {name:"Orionidi",peak:[10,21],active:[10,2,11,7],rate:20,az:90},
 {name:"Leonidi",peak:[11,17],active:[11,6,11,30],rate:15,az:80},
 {name:"Geminidi",peak:[12,14],active:[12,4,12,20],rate:150,az:180},
 {name:"Ursidi",peak:[12,22],active:[12,17,12,26],rate:10,az:15}
];
function dayOfYear(d){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/86400000)}
function activeShower(){
 const d=new Date(), m=d.getMonth()+1, day=d.getDate();
 let candidates=showers.filter(s=>{
   let [m1,d1,m2,d2]=s.active;
   if(m1===m2)return m===m1&&day>=d1&&day<=d2;
   return (m===m1&&day>=d1)||(m===m2&&day<=d2);
 });
 if(!candidates.length)return null;
 return candidates.sort((a,b)=>Math.abs(dayOfYear(d)-dayOfYear(new Date(d.getFullYear(),a.peak[0]-1,a.peak[1])))-Math.abs(dayOfYear(d)-dayOfYear(new Date(d.getFullYear(),b.peak[0]-1,b.peak[1]))))[0];
}
function moonPhase(date){
 const syn=29.530588853, ref=new Date(Date.UTC(2000,0,6,18,14,0));
 let age=((date-ref)/86400000)%syn;if(age<0)age+=syn;
 const frac=age/syn, illum=(1-Math.cos(2*Math.PI*frac))/2;
 let name=frac<.0625?"Luna nuova":frac<.1875?"Falce crescente":frac<.3125?"Primo quarto":frac<.4375?"Gibbosa crescente":frac<.5625?"Luna piena":frac<.6875?"Gibbosa calante":frac<.8125?"Ultimo quarto":frac<.9375?"Falce calante":"Luna nuova";
 return {name,illum,age};
}
function cardinal(deg){let a=["N","NE","E","SE","S","SO","O","NO"];return a[Math.round(deg/45)%8]}
function updateSky(){
 const s=activeShower(), moon=moonPhase(new Date());
 $("moon").textContent=moon.name;
 $("moonInfo").textContent=`Illuminazione circa ${Math.round(moon.illum*100)}%`;
 if(s){
   $("shower").textContent=s.name;
   $("showerInfo").textContent=`Picco intorno al ${s.peak[1]}/${s.peak[0]} · ZHR teorico ~${s.rate}`;
   $("best").textContent=cardinal(s.az)+` ${s.az}°`;
   $("bestInfo").textContent="Punta verso questa zona e guarda anche lateralmente.";
   $("target").textContent=`☄️ ${s.name}: prova ${cardinal(s.az)} (${s.az}°)`;
 }else{
   $("shower").textContent="Nessuno in finestra";
   $("showerInfo").textContent="Le meteore sporadiche restano comunque osservabili.";
   $("best").textContent="Lontano dalla Luna";
   $("bestInfo").textContent="Scegli la parte di cielo più buia.";
   $("target").textContent="🌠 Meteore sporadiche: cerca il cielo più buio.";
 }
}
function setHeading(h){
 heading=(h+360)%360;
 $("heading").textContent=Math.round(heading)+"°";
 $("dir").textContent=cardinal(heading);
 // MODIFICA: Ora ruota SOLO il quadrante (N, E, S, O)
 // Il quadrante deve ruotare in senso antiorario rispetto alla bussola
 $("tickContainer").style.transform = `rotate(${-heading}deg)`;
}
function handleOrientation(e){
 let h;
 if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading;
 else if(typeof e.alpha==="number") h=(360-e.alpha)%360;
 else return;
 setHeading(h);
 $("status").textContent="Bussola attiva · muovi lentamente il telefono per calibrare";
}
async function startSensors(){
 $("status").textContent="Richiedo permessi…";
 if(location.protocol!=="https:" && location.hostname!=="localhost"){
   $("status").textContent="Nota: Chrome richiede HTTPS per i sensori. Usa GitHub Pages/Netlify o localhost.";
 }
 if(navigator.geolocation){
   watch=navigator.geolocation.watchPosition(p=>{
     lat=p.coords.latitude;lon=p.coords.longitude;
     $("gps").textContent=`${lat.toFixed(4)}, ${lon.toFixed(4)}`;
     $("place").textContent=`Accuratezza ±${Math.round(p.coords.accuracy)} m`;
   },e=>{$("place").textContent="GPS: "+e.message},{enableHighAccuracy:true,maximumAge:5000});
 }
 try{
   if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
     const r=await DeviceOrientationEvent.requestPermission();
     if(r!=="granted") throw new Error("permesso orientamento negato");
   }
   window.addEventListener("deviceorientation",handleOrientation,true);
   $("status").textContent="Sensori attivi";
 }catch(e){$("status").textContent="Orientamento non disponibile: "+e.message}
}
$("start").onclick=startSensors;
$("cal").onclick=()=>{$("status").textContent="Calibrazione: fai lentamente una rotazione completa a forma di 8."};
$("nightBtn").onclick=()=>{night=!night;$("redfilter").style.display=night?"block":"none";$("nightBtn").textContent=night?"⚫ NORMALE":"🔴 NOTTE"};
updateSky();
setInterval(updateSky,60000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
